# Production-like local stack: PostgreSQL cho app Rails.
# SQLite vẫn là mặc định cho development/test — không bắt buộc chạy Docker.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketingos
      POSTGRES_PASSWORD: marketingos
      POSTGRES_DB: marketingos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI xem email giao dịch
    profiles: ["mail"]

volumes:
  pgdata:
