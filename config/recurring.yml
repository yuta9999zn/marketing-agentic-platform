# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  dispatch_due_reminders:
    command: "ReminderDispatchJob.perform_later"
    schedule: every 30 minutes
  # Lưới an toàn cho bài Facebook đã lên lịch: job delay bị mất sau restart vẫn
  # được đăng; bài kẹt ở "publishing" được đối soát với feed của Page.
  facebook_dispatch_due_posts:
    command: "FacebookDispatchDueJob.perform_later"
    schedule: every 2 minutes
